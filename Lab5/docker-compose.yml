name: highload-lab5

services:
  postgres:
    container_name: highload-lab5-postgres
    hostname: postgres
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGDATA: "/var/lib/postgresql/18/docker"
      PGUSER: postgres
      PGDATABASE: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres && psql -U postgres -d metabase -c 'SELECT 1' > /dev/null 2>&1" ]
      interval: 5s
      timeout: 10s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./pg-init:/docker-entrypoint-initdb.d
    command: [ "postgres", "-c", "shared_preload_libraries=pg_stat_statements" ]
    networks:
      - highload-lab5-network

  kafka:
    image: apache/kafka:3.9.1
    container_name: highload-lab5-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - highload-lab5-network

  nifi:
    cap_add:
      - NET_ADMIN
    build:
      context: .
      dockerfile: Dockerfile
    container_name: highload-lab5-nifi
    hostname: nifi
    networks:
      - highload-lab5-network
    entrypoint: [ "/bin/sh", "/opt/nifi/scripts/nifi-start-with-local-flow.sh" ]
    environment:
      NIFI_WEB_HTTPS_HOST: 0.0.0.0
      NIFI_WEB_PROXY_HOST: localhost:8443
      NIFI_SENSITIVE_PROPS_KEY: lab5-sensitive-key
      SINGLE_USER_CREDENTIALS_USERNAME: nifilogin
      SINGLE_USER_CREDENTIALS_PASSWORD: nifipass1234
    ports:
      - "8443:8443/tcp" # HTTPS interface
      - "514:514/tcp" # Syslog
      - "514:514/udp" # Syslog
      - "2055:2055/udp" # NetFlow
    volumes:
      - ./postgresql-42.7.9.jar:/opt/drivers/postgresql-42.7.9.jar
      - ./исходные данные:/mock_data
      - ./flow:/opt/nifi/flow-local
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-content-repository:/opt/nifi/nifi-current/content_repository
      - nifi-flowfile-repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi-provenance-repository:/opt/nifi/nifi-current/provenance_repository
      - nifi-database-repository:/opt/nifi/nifi-current/database_repository
      - nifi-logs:/opt/nifi/nifi-current/logs
      - nifi-extensions:/opt/nifi/nifi-current/extensions
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.58.14.x
    container_name: highload-lab5-metabase
    restart: unless-stopped
    hostname: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: postgres
      MB_DB_PASS: postgres
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - highload-lab5-network
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  nifi-conf:
  nifi-state:
  nifi-content-repository:
  nifi-flowfile-repository:
  nifi-provenance-repository:
  nifi-database-repository:
  nifi-logs:
  nifi-extensions:
  postgres-data:
  kafka-data:

networks:
  highload-lab5-network:
    driver: bridge
